<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0f172a">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>AIS01 End node configuration</title>
    <link rel="icon" type="image/svg+xml" href="waterplan-icon.svg">
    <link rel="apple-touch-icon" href="waterplan-icon.svg">
    <link rel="manifest" href="manifest.json">
    <!--
      Deliberately self-contained: this page shares no CSS with the calibration
      flow. Provisioning talks to Dragino v1.3, calibration talks to our custom
      firmware — keeping them apart is the point of a second entry point, and a
      shared stylesheet is how two pages start drifting into one.
      Spec: specs/004-ble-provisioning-mode.md
    -->
    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0; height: 100%;
            background: #0f172a; color: #e2e8f0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            overscroll-behavior: none;
        }
        body { display: flex; flex-direction: column; }

        /*
         * ── The bar ──────────────────────────────────────────────────────
         *
         * This is the calibration page's `#topbar`, rule for rule, from
         * styles/layout.css and styles/components.css. The values are copied
         * rather than the file imported, because this page shipping no shared
         * stylesheet is deliberate (see above) — but a second look must not be
         * a second design.
         *
         * What makes that bar read the way it does, and none of which was here:
         *   · one 8px dot for the link, not a word
         *   · ONE line of text, 12px, --text2, flex:1, ellipsised — nothing
         *     bold, nothing monospaced, nothing competing
         *   · a 36x36 icon button on the end
         *   · the same background as the page, separated by one hairline
         */
        :root {
            --bg: #0f172a;
            --text: #f1f5f9;
            --text2: #94a3b8;
            --muted: #64748b;
            --border: #334155;
        }
        header {
            flex-shrink: 0;
            height: 44px;
            padding: 0 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--bg);
            border-bottom: 1px solid var(--border);
        }
        .icon-btn {
            width: 36px; height: 36px;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
            background: none; border: none; border-radius: 8px;
            color: var(--text2); font-size: 18px; text-decoration: none;
            -webkit-tap-highlight-color: transparent;
        }
        .icon-btn:active { background: rgba(255,255,255,0.08); }
        /* The link, said the way the other bar says it. */
        .dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: var(--muted); flex-shrink: 0;
        }
        .dot.link-connected    { background: #22c55e; }
        .dot.link-reconnecting { background: #fbbf24; }
        .dot.link-disconnected { background: var(--muted); }
        .bar-text {
            flex: 1;
            font-size: 12px; color: var(--text2);
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        /* The IMEI is the one thing in the line worth landing on. Same weight
           `#stats.active` uses when it has something real to say. */
        .bar-text b { color: var(--text); font-weight: 500; }
        .version {
            flex-shrink: 0;
            font-size: 11px; color: var(--muted);
            font-family: ui-monospace, "SF Mono", Menlo, monospace;
        }

        /* The terminal is the instrument, so it takes every spare pixel. */
        main { flex: 1 1 auto; position: relative; min-height: 0; }
        #terminal, #terminal-raw {
            position: absolute; inset: 0;
            overflow-y: auto; padding: 8px 12px 20px;
            font-family: ui-monospace, "SF Mono", Menlo, monospace;
            font-size: 12px; line-height: 1.45;
            -webkit-overflow-scrolling: touch;
        }
        [hidden] { display: none !important; }
        .line { white-space: pre-wrap; word-break: break-word; }
        .line-rx   { color: #cbd5e1; }
        .line-tx   { color: #7dd3fc; }
        .line-note { color: #64748b; }
        .line-ok   { color: #4ade80; font-weight: 600; }
        .line-fail { color: #f87171; font-weight: 600; }

        /* Raw view: no per-line elements, no styling, no interpretation —
           the buffer printed as it arrived. It is a SEPARATE element from the
           annotated terminal on purpose. One element rendering two views meant
           that showing either one destroyed the other, and a log a toggle can
           erase is not a log. */
        #terminal-raw {
            margin: 0;
            white-space: pre-wrap; word-break: break-word;
            color: #cbd5e1;
        }

        #log-controls {
            position: absolute; right: 8px; bottom: 6px;
            display: flex; align-items: center; gap: 6px;
        }
        #log-controls button {
            font-size: 10px; font-weight: 600; letter-spacing: 0.04em;
            color: #94a3b8; background: #1e293bdd;
            border: 1px solid #334155; border-radius: 4px;
            padding: 4px 8px;
            -webkit-tap-highlight-color: transparent;
        }
        #log-controls button:active { background: #334155; }
        #live {
            font-size: 11px; color: #4ade80;
            background: #0f172acc; padding: 2px 6px; border-radius: 4px;
            pointer-events: none;
        }

        .actions {
            flex: 0 0 auto;
            display: flex; gap: 6px; padding: 8px;
            border-top: 1px solid #1e293b;
            padding-bottom: calc(8px + env(safe-area-inset-bottom));
        }
        .actions button {
            flex: 1; min-height: 56px; padding: 6px 4px;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 3px;
            border: 1px solid #334155; border-radius: 8px;
            background: #1e293b; color: #e2e8f0;
            font-size: 12px; font-weight: 600;
            -webkit-tap-highlight-color: transparent;
        }
        .actions button:active { background: #334155; }
        .actions button.armed { background: #b45309; border-color: #f59e0b; }

        /*
          The per-stage mark reports what the stage's own commands came back
          with — confirmation, not device-phase inference. Its wording is
          deliberately uneven: stages whose evidence is weak must not wear the
          same green tick as stages the modem or the platform actually proved.
        */
        .mark {
            font-size: 10px; font-weight: 500; line-height: 1;
            color: #64748b; min-height: 11px;
        }
        .mark-ok    { color: #4ade80; }
        .mark-weak  { color: #fbbf24; }
        .mark-fail  { color: #f87171; }
        .mark-run   { color: #7dd3fc; }

        .bar {
            flex: 0 0 auto; display: flex; gap: 6px; padding: 8px;
            border-top: 1px solid #1e293b;
        }
        .bar button, .bar label {
            flex: 1; min-height: 40px;
            display: flex; align-items: center; justify-content: center;
            border: 1px solid #334155; border-radius: 8px;
            background: #0f172a; color: #cbd5e1; font-size: 13px;
        }
        .bar input { display: none; }

        /*
         * The manual AT row.
         *
         * Every stage on this screen is a canned sequence, which is right for
         * provisioning and useless the moment the unit needs one command that
         * nobody scripted — `AT+CSQTIME`, a `AT+CFG` read, a QFLST after a
         * failed write. Without this the answer was "plug in the USB cable and
         * use the CLI", i.e. abandon the transport under test to change a
         * setting on it.
         *
         * It sends through the same `sendLine` as everything else, so the
         * console line law applies unchanged and the reply lands in the same
         * terminal as the rest of the session.
         */
        .at-row { flex: 0 0 auto; display: flex; gap: 6px; padding: 0 8px 8px; }
        .at-row input {
            flex: 1; min-height: 40px; padding: 0 10px;
            border: 1px solid #334155; border-radius: 8px;
            background: #0b1220; color: #e2e8f0;
            font-family: ui-monospace, monospace; font-size: 13px;
        }
        .at-row input::placeholder { color: #475569; }
        .at-row button {
            flex: 0 0 88px; min-height: 40px;
            border: 1px solid #334155; border-radius: 8px;
            background: #0f172a; color: #cbd5e1; font-size: 13px;
        }
    </style>
</head>
<body>
    <header>
        <a class="icon-btn" href="index.html" aria-label="Back">←</a>
        <span id="link-state" class="dot link-disconnected" title="BLE link"></span>
        <span class="bar-text">AIS01 End node configuration · <b id="imei">—</b></span>
        <span id="app-version" class="version"></span>
    </header>

    <main>
        <div id="terminal"></div>
        <pre id="terminal-raw" hidden></pre>
        <!-- Controls sit on the log they act on. RAW shows the bytes exactly
             as the device sent them; SHARE hands the whole buffer to whoever
             has to diagnose it, which on a bench is not the person holding the
             phone. -->
        <div id="log-controls">
            <button id="raw-toggle">RAW</button>
            <button id="copy-log">SHARE</button>
            <!-- ATZ is one of the commands the app answers itself, so it
                 restarts the unit without anyone reaching for the board. The
                 link drops with it and comes back on its own. -->
            <button id="btn-reset">RESET</button>
            <!-- The bundle is remembered in this browser between reloads, so a
                 bench session stops paying a file picker per attempt. FORGET is
                 how it stops being remembered when the unit changes. -->
            <button id="btn-forget">FORGET</button>
            <span id="live">▼ live</span>
        </div>
    </main>

    <div class="bar">
        <label for="bundle-input">Load bundle</label>
        <!-- No `accept` filter on purpose. iOS Files greys out .json on some
             versions, which looks like the file is missing rather than
             filtered — and the file always arrives from somewhere we do not
             control (AirDrop, Drive, a download). The parser rejects anything
             that is not a bundle, with a reason, which is the better place to
             be strict. -->
        <!-- No `webkitdirectory`, and that is the whole point of this input.
             Asking for a DIRECTORY is what kept Drive out: the phone's own
             picker already offers Drive as a source, but cloud providers
             expose files, not folders, so a directory request shows the
             technician an empty Drive. Asking for files lets them browse
             straight into it, with no OAuth, no API key and no account to
             configure.

             The cost is the IMEI. AWS names the PEMs after the certificate ID,
             so with loose files the unit's identity exists only in the folder
             name that a file pick discards — and the wrong-unit check goes
             with it. The prepared bundle is the answer: `ais01 certs bundle`
             writes one AIS01-CB-<IMEI>.json carrying the IMEI, the password
             and both PEMs, so a single tap in Drive keeps the check alive.
             loadFiles() still accepts loose files, and still says the check is
             off when it gets them. -->
        <input id="bundle-input" type="file" multiple>
        <button id="btn-connect">Connect BLE</button>
    </div>

    <!-- One command, sent as typed. The session has to be unlocked first: the
         app answers `AT` and `AT?` itself but ignores everything else until the
         password lands, so an unanswered command this early is a locked
         console, not a wrong command. -->
    <div class="at-row">
        <input id="at-input" type="text" spellcheck="false"
               autocapitalize="off" autocorrect="off"
               placeholder="AT+CSQTIME=1">
        <button id="at-send">SEND</button>
    </div>

    <div class="actions">
        <button id="btn-login">
            <span class="label">①&nbsp;LOGIN</span><span id="mark-login" class="mark"></span>
        </button>
        <button id="btn-certs">
            <span class="label">②&nbsp;CERTS</span><span id="mark-certs" class="mark"></span>
        </button>
        <button id="btn-config">
            <span class="label">③&nbsp;CONFIG</span><span id="mark-config" class="mark"></span>
        </button>
        <button id="btn-verify">
            <span class="label">④&nbsp;VERIFY</span><span id="mark-verify" class="mark"></span>
        </button>
    </div>

    <script type="module">
        import { initProvision } from './modules/provision.js';
        initProvision();
    </script>
</body>
</html>
