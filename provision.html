<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <!-- The bar's colour, not the page's: this paints the strip the OS puts
         directly above the bar, and those two touching must read as one. -->
    <meta name="theme-color" content="#070c17">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>AIS01 End node configuration</title>
    <link rel="icon" type="image/svg+xml" href="waterplan-icon.svg">
    <link rel="apple-touch-icon" href="waterplan-icon.svg">
    <link rel="manifest" href="manifest.json">
    <!--
      Deliberately self-contained: this page shares no CSS with the calibration
      flow. Provisioning talks to Dragino v1.3, calibration talks to our custom
      firmware — keeping them apart is the point of a second entry point, and a
      shared stylesheet is how two pages start drifting into one.
      Spec: specs/004-ble-provisioning-mode.md
    -->
    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0; height: 100%;
            background: #070c17; color: #e2e8f0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            overscroll-behavior: none;
        }
        body { display: flex; flex-direction: column; }

        /*
         * ── The bar ──────────────────────────────────────────────────────
         *
         * This is the calibration page's `#topbar`, rule for rule, from
         * styles/layout.css and styles/components.css. The values are copied
         * rather than the file imported, because this page shipping no shared
         * stylesheet is deliberate (see above) — but a second look must not be
         * a second design.
         *
         * What makes that bar read the way it does, and none of which was here:
         *   · one 8px dot for the link, not a word
         *   · ONE line of text, 12px, --text2, flex:1, ellipsised — nothing
         *     bold, nothing monospaced, nothing competing
         *   · a 36x36 icon button on the end
         *   · one hairline under it, and nothing heavier
         *
         * One rule of that bar is deliberately NOT copied: its background.
         * The calibration page is a viewfinder with a bar on top, so a bar
         * the same colour as the page is right there. This page is a log
         * with furniture at both ends — see `--chrome` below.
         */
        :root {
            --bg: #141f33;
            --text: #f1f5f9;
            --text2: #94a3b8;
            --muted: #64748b;
            --border: #334155;

            /*
             * ── Furniture vs instrument ─────────────────────────────────
             *
             * Three bands on this page and only two kinds of thing. The bar
             * and the console are FURNITURE: session controls, always there,
             * never the reason anyone opened the page. Between them is the
             * INSTRUMENT — the two logs, the one surface a technician
             * actually reads.
             *
             * The console already sat on its own darker ground for exactly
             * this reason; the bar did not, and shared `--bg` with the logs
             * separated by a hairline. So the page had the rule and applied
             * it to one end. These two values are that rule, named, applied
             * to both ends, and the logs keep `--bg` — furniture recedes,
             * the instrument sits on top of it.
             *
             * `--chrome-2` is the logs' OWN furniture: the pane headers, the
             * legend, the line counter. It is a step, not a repeat, of
             * `--chrome`: identical to the bar would fuse the HISTORY header
             * into the bar above it, which is the seam this whole change
             * exists to draw.
             */
            --chrome:    #070c17;   /* top bar, console foot */
            --chrome-2:  #0c1424;   /* pane heads, log foot */

            /*
             * The calibration page's accent, from `styles/base.css`.
             *
             * That page says one thing with colour that this one did not: a
             * control the session turns on is outlined in sky blue before it
             * is used, not left grey until something happens to it. Same two
             * values, same names, so the two pages agree on what blue means.
             */
            --accent:    #38bdf8;
            --accent-bg: rgba(56,189,248,0.12);
            /* Its `--surface`, under the same name: the grey the bar's own
               buttons already sat on, as a literal, in one place. */
            --surface:   #1e293b;

            /*
             * The left rail.
             *
             * Two things live in this column and they have to end on the same
             * x: the raw serial pane, and the command trigger under it. They
             * were two independent numbers that happened to read the same, and
             * they did not land the same — the trigger sits inside a row with
             * 8px of padding, so an equal width put its right edge 8px past
             * the pane's divider.
             *
             * One number now, and the offset is derived from it rather than
             * kept in somebody's head.
             */
            --rail: 400px;
            --rail-pad: 8px;

            /*
             * ── Borrowed from the dashboard's design system ──────────────
             *
             * `cli/ais01_cli/dashboard/tokens.css` and its DESIGN-SYSTEM.md.
             * This page already copies that dashboard's History — the voices,
             * the phase headers, the boot dividers — because a technician
             * reading one and then the other should not have to learn two
             * languages. The stage chips and the state cards are the rest of
             * the same borrowing.
             *
             * Values are copied rather than the file imported, for the reason
             * at the top of this page: no shared stylesheet with anything. A
             * second look must not become a second design, and an import from
             * another repo is not available to a static page anyway.
             */
            --panel:     #0f1d30;   /* cards and chips */
            --panel-up:  #16263d;   /* raised inner surfaces */
            /* The third step, and this page's own: nothing in the dashboard
               floats over everything else the way a modal does. The platform's
               FeedbackAlert is pure white for exactly this reason — the alert
               is the most elevated surface there is, and on a dark page that
               still means the lightest one. */
            --panel-top: #1e2f4a;   /* the modal, over everything */
            --border-2:  #2a3f5a;   /* stronger dividers, chip outlines */
            --green:     #22c55e;
            --green-txt: #4ade80;
            --green-glow: rgba(34,197,94,.35);
            --partial:   #a3e635;   /* advancing toward done, not stalled */
            --amber-bd:  rgba(251,191,36,.50);
            --amber-glow: rgba(251,191,36,.35);
            --red:       #ef4444;
            --red-bd:    rgba(239,68,68,.45);
            --txt-faint: #5b6f86;   /* labels, timestamps, meta */
            --fs-label:  10px;
        }
        header {
            flex-shrink: 0;
            /* 44 was the calibration bar's height, and it is sized around a
               12px line. This bar reads a 17px unit number, so the line sets
               the height: 17px at 1.2, with 16px of air above and below. */
            height: 52px;
            padding: 0 10px 0 4px;
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--chrome);
            border-bottom: 1px solid var(--border);
            /* The console's shadow, pointing the other way. The hairline says
               where the bar ends; the shadow says which of the two is on top,
               and the answer has to be the log.

               Shorter than the console's, and measured rather than guessed:
               at the console's 6px/16px the falloff was still darkening the
               HISTORY header 9px down, which put that header within a shade
               of the bar itself — the one seam this change exists to draw. */
            box-shadow: 0 2px 6px rgba(0,0,0,0.30);
            position: relative; z-index: 2;
        }
        .icon-btn {
            width: 36px; height: 36px;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
            background: none; border: none; border-radius: 8px;
            color: var(--text2); font-size: 18px; text-decoration: none;
            -webkit-tap-highlight-color: transparent;
        }
        .icon-btn:active { background: rgba(255,255,255,0.08); }
        /* The link, said the way the other bar says it. */
        .dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: var(--muted); flex-shrink: 0;
        }
        /* A live link is a lit lamp, not a coloured pixel: the halo is what
           carries across a bench at arm's length, where the dot is 8px and
           the technician is not looking for it. */
        .dot.link-connected {
            background: #22c55e; box-shadow: 0 0 0 3px rgba(34,197,94,0.18);
        }
        .dot.link-reconnecting {
            background: #fbbf24; box-shadow: 0 0 0 3px rgba(251,191,36,0.18);
        }
        .dot.link-disconnected { background: var(--muted); box-shadow: none; }
        /*
         * ── The bar's type: two roles at one size ────────────────────────
         *
         * The bar was four sizes deep — a 12px line, 11px buttons, an 11px
         * version — and enlarging the sentence to 17px only made that worse:
         * the biggest thing on the bar became the one string that never
         * changes and tells a technician nothing.
         *
         * So the two things that matter are the SAME size, and they are told
         * apart by FAMILY instead. Sans is the app talking; mono is the
         * device. That distinction is already the law everywhere else on this
         * page — the log, the raw pane, the line counter and the version are
         * all mono because they are all facts that came off a wire — so the
         * IMEI being mono is this bar catching up with the rest of the page
         * rather than a new idea.
         *
         * Everything else on the bar is utility at 10px. Two roles and one
         * utility size is a scale; four sizes is an accident.
         */
        .bar-id {
            flex: 1 1 auto; min-width: 0;
            display: flex; align-items: center; gap: 11px;
        }
        .bar-title {
            /* `flex: 0 1 auto` and the ellipsis are on THIS, not on the unit:
               when the bar runs out of room the app's name is what gives way,
               and the IMEI is never the thing that gets truncated. */
            flex: 0 1 auto; min-width: 0;
            /* The 17px you asked for, kept — but in `--text2`, not `--text`.
               Two white things of the same size beside each other is what a
               bar with no hierarchy looks like, and of the two, the one that
               changes every unit is the one worth the brightness. */
            font-size: 17px; font-weight: 600; letter-spacing: -0.01em;
            color: var(--text2);
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        /* Gone: the plate below has an edge of its own, and a rule beside a
           bordered object is a second line drawn at the same seam. */
        .bar-rule { display: none; }
        /*
         * ── The plate ────────────────────────────────────────────────────
         *
         * The unit stops being a word in a sentence and becomes an OBJECT.
         *
         * Everything before this was the same flat strip with the type
         * resized: title, dot, number, buttons, all floating on one ground at
         * the same depth. Nothing on it was a thing you could point at, which
         * is why making the letters bigger changed nothing — there was no
         * structure to change.
         *
         * A provisioned unit carries a label with its IMEI printed on it, and
         * matching the number on the screen to the number on the sticker is
         * literally the job at the bench. So the screen shows a label: raised
         * off the bar, framed, the number set in mono and tabular so digits
         * line up between one unit and the next, with the link as its bullet.
         *
         * It is the only bordered object on a resting bar apart from PAIR,
         * and those two are the bar's whole content: which unit, and is it
         * listening.
         */
        .bar-unit {
            flex: 0 0 auto;
            display: inline-flex; align-items: center; gap: 9px;
            padding: 5px 11px 5px 9px;
            background: var(--panel);
            border: 1px solid var(--border-2); border-radius: 8px;
        }
        .bar-unit b {
            font-family: ui-monospace, "SF Mono", Menlo, monospace;
            font-size: 16px; font-weight: 600;
            /* 15 digits that get read off a label and compared by eye. */
            font-variant-numeric: tabular-nums; letter-spacing: 0.02em;
            color: var(--text);
        }
        .version {
            flex-shrink: 0;
            font-size: 10px; color: var(--muted);
            font-family: ui-monospace, "SF Mono", Menlo, monospace;
        }
        /* Below this the app's name is the first thing to go: the unit and the
           controls are what a phone at a bench has room for. */
        @media (max-width: 700px) {
            .bar-title, .bar-rule { display: none; }
        }

        /*
         * ── The two logs ─────────────────────────────────────────────────
         *
         * The same split the CLI dashboard uses: the raw serial on one side,
         * the read line on the other, both live at once. They were already two
         * elements written to in parallel — only one was hidden — so this is
         * the layout catching up with what the data already did.
         *
         * Which is on which side follows the reading: on a wide screen the raw
         * stream is the left column and the annotated one the right, so the eye
         * goes evidence → reading. On a phone there are no columns to give, so
         * they stack, and the annotated one is on top because it is the one you
         * act on; the raw is underneath, where you go to check.
         *
         * The terminal is still the instrument, so both panes take every spare
         * pixel and the headers cost 18px.
         */
        main {
            flex: 1 1 auto; position: relative; min-height: 0;
            display: flex; flex-direction: column;
            /* Stated rather than inherited. It is the same value `body` has,
               but this is the one band on the page that is meant to be the
               lit surface — leaving it to inheritance is how it silently
               follows the next person who changes the page background. */
            background: var(--bg);
        }
        .pane {
            flex: 1 1 0; min-height: 0; min-width: 0;
            display: flex; flex-direction: column; overflow: hidden;
        }
        /* Furniture, not log: these label the pane, they are not written to
           by anything the device says. Same reasoning as the bar and the
           console, one step lighter — see `--chrome-2`. */
        .pane-head {
            flex: 0 0 auto; padding: 3px 12px;
            font-size: 9px; font-weight: 600; letter-spacing: 0.1em;
            color: var(--muted); background: var(--chrome-2);
            border-bottom: 1px solid #1e293b;
        }
        .pane-head.legend {
            display: flex; align-items: center; gap: 5px;
            letter-spacing: 0; font-weight: 500; flex-wrap: wrap;
        }
        .pane-head.legend .v {
            padding: 0 4px; border: 1px solid #334155; border-radius: 3px;
            font-size: 9px; font-weight: 700;
        }
        .pane-head.legend .v + * { margin-right: 4px; }
        /* Same element here, descendant in a row — hence the second set. */
        .pane-head.legend .voice-dev { color: #cbd5e1; }
        .pane-head.legend .voice-cmd { color: #7dd3fc; border-color: #0e7490;
                                       background: #0e749022; }
        .pane-head.legend .voice-sys { color: #64748b; }
        .pane-head.legend .voice-you { color: #fbbf24; border-color: #b4530966;
                                       background: #b4530922; }
        /* The raw stream is a narrow sidebar with a foot that measures it, not
           half the screen: it is the thing you check, not the thing you read. */
        .pane-annotated { order: 1; flex: 1 1 auto; }
        .pane-raw       { order: 2; flex: 0 0 34%; border-top: 1px solid #1e293b; }
        @media (min-width: 700px) {
            main { flex-direction: row; }
            .pane-raw       { order: 1; flex: 0 0 var(--rail); border-top: none;
                              border-right: 1px solid #1e293b; }
            .pane-annotated { order: 2; }
        }
        /* The counter measures the pane, it is not part of it — same ground
           as the head it closes the pane against. */
        .log-foot {
            flex: 0 0 auto; height: 28px; padding: 0 12px;
            display: flex; align-items: center; justify-content: space-between;
            background: var(--chrome-2);
            border-top: 1px solid #1e293b;
            font-size: 10px; color: var(--muted);
        }
        .log-foot .live { display: inline-flex; align-items: center; gap: 6px; }
        .log-foot .live .dot { width: 6px; height: 6px; border-radius: 50%;
            background: #22c55e; box-shadow: 0 0 6px #22c55e; }
        .log-foot .off .dot { background: var(--muted); box-shadow: none; }
        #raw-count { font-variant-numeric: tabular-nums; }

        /*
         * ── The reading, as the dashboard writes it ──────────────────────
         *
         * Three things, taken from cli/ais01_cli/dashboard/index.html:
         *
         * VOICES. Every row says who is speaking — the device, us, the app's
         * own verdict, or you. Colour alone cannot: a green line could be the
         * device reporting success or the app concluding it, and those are not
         * the same claim.
         *
         * PHASE HEADERS. A stage opens a section whose colour is the section's
         * verdict: amber while it runs, green when it closes clean, red the
         * instant any row inside it fails — and it stays red. The header is the
         * verdict, the rows keep the detail.
         *
         * BOOT DIVIDERS. The cycle boundaries, drawn where the raw log draws
         * them, so a line can be placed in the boot it belongs to.
         */
        /* 2px between rows. At 12px/1.45 the log was a solid block of text and
           the eye had nothing to step on; the gap is what lets a row be scanned
           as a row rather than found by reading. */
        .line { display: flex; gap: 8px; align-items: baseline; margin-bottom: 2px; }
        .line .t { flex: 0 0 auto; color: #475569; }
        .line .v {
            flex: 0 0 auto; min-width: 26px; padding: 0 4px;
            border: 1px solid #334155; border-radius: 3px;
            font-size: 9px; font-weight: 700; letter-spacing: 0.06em;
            text-align: center; color: var(--muted);
        }
        /*
         * The field column, for rows that name a thing and then give its value
         * — ⓪'s checklist is all of them today.
         *
         * It had been spaces: the label padded to twelve characters inside the
         * message span. That lines up only while the font is monospaced and the
         * label is short, and it welds the label to its value so neither can be
         * styled without the other. Given a column it can be what it is — a
         * heading — and it borrows the same treatment headings get everywhere
         * else on this screen.
         */
        .line .k {
            flex: 0 0 104px; min-width: 0;
            font-size: 10px; font-weight: 700; letter-spacing: 0.08em;
            text-transform: uppercase; color: var(--txt-faint);
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .line .m { flex: 1 1 auto; min-width: 0; }
        .voice-dev .v { color: #cbd5e1; }
        .voice-cmd .v { color: #7dd3fc; border-color: #0e7490; background: #0e749022; }
        .voice-sys .v { color: #64748b; }
        .voice-you .v { color: #fbbf24; border-color: #b4530966; background: #b4530922; }

        .phase {
            margin: 10px 0 4px; padding: 5px 8px;
            display: flex; align-items: center; gap: 7px;
            border: 1px solid #334155; border-radius: 4px;
            background: rgba(255,255,255,0.025);
            font-size: 10px; font-weight: 800; letter-spacing: 0.07em;
            text-transform: uppercase; color: #fbbf24;
        }
        .phase::before {
            content: ""; width: 7px; height: 7px; border-radius: 50%;
            background: currentColor; box-shadow: 0 0 7px currentColor;
        }
        .phase.is-ok   { color: #4ade80; }
        .phase.is-fail { color: #f87171; }

        .divider {
            display: flex; align-items: center; gap: 8px;
            margin: 14px 0 8px;
            font-size: 9px; font-weight: 700; letter-spacing: 0.1em;
            color: #38bdf8;
        }
        .divider::before, .divider::after {
            content: ""; flex: 1; height: 1px; background: rgba(56,189,248,0.4);
        }
        .divider.reset { color: #22d3ee; }
        .divider.reset::before, .divider.reset::after { background: rgba(34,211,238,0.5); }
        .divider.end { color: #a78bfa; }
        .divider.end::before, .divider.end::after { background: rgba(167,139,250,0.5); }
        #terminal, #terminal-raw {
            flex: 1 1 auto; min-height: 0;
            overflow-y: auto; padding: 8px 12px 20px;
            font-family: ui-monospace, "SF Mono", Menlo, monospace;
            font-size: 12px; line-height: 1.45;
            -webkit-overflow-scrolling: touch;
        }
        [hidden] { display: none !important; }
        .line { white-space: pre-wrap; word-break: break-word; }
        .line-rx   { color: #cbd5e1; }
        .line-tx   { color: #7dd3fc; }
        .line-note { color: #64748b; }
        /*
         * Between two groups of rows that ask different questions — see
         * `rule()`. It was #1e293b, which is the divider colour used BETWEEN
         * panels, over a panel background; inside the log, on #0f172a, it was
         * a line nobody could see. --border is the one that reads here.
         */
        .line-rule {
            height: 1px; margin: 9px 0; background: var(--border);
        }
        .line-ok   { color: #4ade80; font-weight: 600; }
        .line-fail { color: #f87171; font-weight: 600; }

        /* Raw view: no per-line elements, no styling, no interpretation —
           the buffer printed as it arrived. It is a SEPARATE element from the
           annotated terminal on purpose. One element rendering two views meant
           that showing either one destroyed the other, and a log a toggle can
           erase is not a log. */
        #terminal-raw {
            margin: 0;
            white-space: pre-wrap; word-break: break-word;
            color: #cbd5e1;
        }

        /*
         * The session's controls, all on the bar.
         *
         * SHARE and CHANGE UNIT FOLDER used to float over the bottom-right of
         * the terminal, which put them on top of the one thing on this screen
         * that must never be covered — and gave three controls of the same
         * kind three different homes. They are all about the session rather
         * than about the device: which unit, where the log goes, and whether
         * there is a link at all. One line, one cluster.
         */
        .bar-tools { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
        /*
         * Three filled chips of equal weight, and they are not equal things.
         *
         * SHARE LOG and CHANGE UNIT FOLDER are housekeeping — used once a
         * session, or never. PAIR is the way in: nothing on this page works
         * until it has been pressed. Giving all three the same fill made the
         * bar read as a toolbar of equals and left the one control that has
         * to be found looking like the other two.
         *
         * So these two lose their fill and keep only their words, and the
         * outline arrives when a finger or a cursor does. The only outlined
         * thing on a resting bar is the one worth pressing.
         */
        .bar-tools button {
            display: inline-flex; align-items: center; gap: 5px;
            padding: 6px 10px;
            font-size: 10px; font-weight: 700; letter-spacing: 0.06em;
            color: var(--text2); background: transparent;
            border: 1px solid transparent; border-radius: 7px;
            white-space: nowrap;
            transition: color .12s, border-color .12s, background .12s;
            -webkit-tap-highlight-color: transparent;
        }
        .bar-tools button:hover { color: var(--text); border-color: var(--border); }
        .bar-tools button:focus-visible {
            outline: none; color: var(--text); border-color: var(--accent);
        }
        .bar-tools button:active { background: var(--surface); color: var(--text); }
        .bar-tools svg { width: 12px; height: 12px; flex-shrink: 0; }

        /*
         * Pairing sits in the bar, next to the dot that reports the link.
         *
         * It had a full-width row of its own, which said "this is the main
         * thing on the screen" about a button that is pressed once per browser,
         * ever — everything after that first pairing re-attaches with no
         * gesture. A row that wide for an action that rare pushed the terminal
         * up and read as an error state.
         *
         * Beside the dot is where it belongs: the dot says the link is down,
         * and the fix is the next thing along.
         */
        #pair-row { flex-shrink: 0; display: flex; }
        /*
         * The one control on the bar that reports rather than acts, so it is
         * the one that carries colour. Green is the link being up — the same
         * green the dot uses, said in words for the one fact worth confirming
         * at a glance from a bench.
         */
        /*
         * The one control on the bar that is about the radio, so it wears the
         * radio's colour — the calibration page's accent, which is the blue
         * Bluetooth is drawn in everywhere.
         *
         * The OUTLINE carries that, and it carries it from the first paint:
         * this button is the way in, and a grey button beside two other grey
         * buttons does not say so. The INSIDE stays the bar's own grey with a
         * near-white label, because blue on blue would spend the accent on a
         * state that has not happened yet.
         *
         * Then the states below take the outline away from blue, which is the
         * point of it being blue: green is not "one more colour on the bar",
         * it is this button no longer asking to be pressed.
         */
        #btn-connect {
            border-color: var(--accent);
            background: var(--surface);
            color: var(--text);
        }
        #btn-connect:hover { border-color: var(--accent); background: #24344a; }
        #btn-connect svg { color: var(--accent); }
        #btn-connect.link-connected {
            color: #4ade80; border-color: #22c55e66; background: #14532d44;
        }
        #btn-connect.link-connected svg { color: #4ade80; }
        #btn-connect.link-reconnecting {
            color: #fbbf24; border-color: #b4530966; background: #b4530922;
        }
        #btn-connect.link-reconnecting svg { color: #fbbf24; }

        .actions {
            display: flex; gap: 6px;
            padding: 8px var(--rail-pad);
            border-top: 1px solid #1e293b;
            padding-bottom: calc(8px + env(safe-area-inset-bottom));
        }
        /*
         * The stage chip — `.step-chip` from the dashboard's design system.
         *
         * The buttons had been a number glyph and a shouted sentence stacked
         * centre-aligned, which is what you get from styling a label instead
         * of designing a component. The dashboard had already solved it and
         * the solution is a hierarchy rather than a size: a status circle,
         * the name in ordinary sentence case, and the stage's own mark under
         * it. Nothing shouts, and nothing is centred.
         *
         * The circle carries state and nothing else. A number inside it was
         * this app's invention and it broke the one rule the atom has: in
         * every state the system defines, the glyph and the ring are chosen
         * together. A grey number in an amber ring is not one of them, and
         * the order it was carrying is already given by the position.
         */
        .actions button {
            flex: 1; min-width: 0;
            padding: 12px 13px; border-radius: 14px;
            border: 1.5px solid var(--border-2); background: var(--panel);
            display: flex; flex-direction: row; align-items: center; gap: 10px;
            text-align: left; color: var(--text);
            transition: border-color .15s, box-shadow .15s;
            -webkit-tap-highlight-color: transparent;
        }
        .actions button:active { background: var(--panel-up); }
        .actions .chip-txt {
            display: flex; flex-direction: column; gap: 3px;
            min-width: 0; flex: 1 1 auto;
        }
        .actions .name {
            font-size: 14px; font-weight: 600; color: var(--text);
            line-height: 1.35;
        }

        /*
         * StatusCircle (C12). One atom, four states, used by the chips and the
         * cards alike — which is the point of taking it from a system rather
         * than inventing a dot per place.
         */
        .status-circle {
            width: 30px; height: 30px; border-radius: 999px; flex-shrink: 0;
            display: inline-flex; align-items: center; justify-content: center;
            border: 2px solid var(--amber-bd); background: transparent;
            font-size: 13px; font-weight: 700; line-height: 1;
            /* Transparent by default, so a state that has no glyph shows an
               empty ring rather than whatever colour was left over. In every
               state below, what is inside the ring and what draws it are
               chosen together — there is no state where they disagree. */
            color: transparent;
        }
        .status-circle.is-done {
            background: var(--green); border-color: var(--green); color: #06210f;
        }
        .status-circle.is-current { border-color: var(--green); color: var(--green-txt); }
        .status-circle.is-partial { border-color: var(--partial); color: var(--partial); }
        /* Empty on purpose: an untouched stage has nothing to report, and the
           order it sits in is given by its position in the row. */
        .status-circle.is-pending { border-color: var(--amber-bd); color: transparent; }
        .status-circle.is-fail {
            background: var(--red); border-color: var(--red); color: #2a0808;
        }

        /* The chip takes its status colour from the circle it carries, so a
           finished stage reads as all-green rather than half-lit. */
        .actions button.is-done    { border-color: var(--green);
                                     box-shadow: 0 0 16px var(--green-glow); }
        .actions button.is-done .name { color: var(--green-txt); }
        .actions button.is-current { border-color: var(--green);
                                     box-shadow: 0 0 16px var(--green-glow); }
        /* No name colour for partial or current: the circle already carries
           them, and a chip that tints its title for every state spends its
           whole colour budget on the states with the least to say. */
        .actions button.is-partial { border-color: var(--partial); }
        .actions button.is-fail    { border-color: var(--red);
                                     box-shadow: 0 0 16px var(--red-bd); }
        .actions button.is-fail .name { color: #fca5a5; }

        @media (max-width: 1100px) {
            .actions .name { font-size: 13px; }
            .status-circle { width: 26px; height: 26px; font-size: 12px; }
        }
        .actions button:active { background: #334155; }
        .actions button.armed { background: #b45309; border-color: #f59e0b; }

        /*
          The per-stage mark reports what the stage's own commands came back
          with — confirmation, not device-phase inference. Its wording is
          deliberately uneven: stages whose evidence is weak must not wear the
          same green tick as stages the modem or the platform actually proved.
        */
        /*
         * The validation line — the dashboard's `.date`/`.by` meta, which is
         * the closest thing its system has to this. Faint by default and
         * coloured only when it carries proof, because five permanently
         * coloured marks compete with five status circles that already say
         * the state.
         *
         * Which marks get to be green is the uneven part, and it is
         * deliberate: only ② and ⑤ hold evidence strong enough — a checksum
         * the modem computed over what it stored, and a CONNACK that AWS IoT
         * only issues to a certificate that is registered, active, attached
         * and key-matched. "9/9 OK" is not that, and stays grey.
         */
        /*
         * Clipped rather than allowed to push the chip wider.
         *
         * The row is one line of equal chips and there are seven of them now,
         * so a mark carrying an advertised device name is the one thing here
         * long enough to break the layout for the other six. It is clipped with
         * an ellipsis and `setMark` puts the whole value in the element's
         * title, so nothing is lost — it is one hover away on the only
         * platform this runs on.
         */
        .mark {
            font-size: 11px; font-weight: 500; line-height: 1.3;
            color: var(--txt-faint); min-height: 13px;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        /*
         * ⓪ reports the unit, in full, in figures you can compare against the
         * label on the board. A tick cannot do that: picking 869181072714163
         * instead of 869181072714122 looks identical under a checkmark, and
         * that is the exact mistake every guard on this screen exists to catch.
         *
         * It used to be 1.7 chips wide to fit those fifteen digits beside a
         * centred label. The chip layout gives the mark its own line at the
         * full width of the text column, so the room is already there and the
         * six stages can be six equal things — which is what they are.
         */
        #mark-bundle {
            font-family: ui-monospace, "SF Mono", Menlo, monospace;
            font-variant-numeric: tabular-nums;
            letter-spacing: -0.2px;
        }
        .mark-ok    { color: var(--green-txt); }   /* proof */
        .mark-fail  { color: #fca5a5; }            /* refused */
        .mark-weak  { color: var(--txt-faint); }   /* observed, not proof */
        .mark-run   { color: var(--txt-faint); }   /* still going */

        /*
         * The manual AT row.
         *
         * Every stage on this screen is a canned sequence, which is right for
         * provisioning and useless the moment the unit needs one command that
         * nobody scripted — `AT+CSQTIME`, a `AT+CFG` read, a QFLST after a
         * failed write. Without this the answer was "plug in the USB cable and
         * use the CLI", i.e. abandon the transport under test to change a
         * setting on it.
         *
         * It sends through the same `sendLine` as everything else, so the
         * console line law applies unchanged and the reply lands in the same
         * terminal as the rest of the session.
         *
         * Pick one, or type one — two ways into the same send, so they are the
         * same size. The field had the whole row when it was the only way in,
         * and neither shrinking it to a stub nor letting the picker sprawl was
         * right: both made one of the two look like the afterthought. Equal
         * says what is true, which is that either will do.
         *
         * Both take their width from `--rail`, so they line up under the raw
         * pane rather than merely near it.
         */
        /*
         * Where the instrument ends and the controls begin.
         *
         * The two panes and the two control rows had been one continuous dark
         * surface with hairlines between them, so the eye had nothing telling
         * it which half it was reading — and these halves are not the same
         * kind of thing at all. Above is what the device says, which only ever
         * scrolls. Below is what you can do to it, which is fixed.
         *
         * So the controls sit on their own darker ground, closed off by the
         * one strong line on the screen. The hairline between the two control
         * rows stays a hairline: those two ARE the same kind of thing.
         */
        /*
         * ── FeedbackAlert ────────────────────────────────────────────────
         *
         * The `<dialog>` had markup and no rules at all, so what shipped was
         * the browser's own default: a white slab, Times-ish, with two OS
         * buttons. Every number below is the platform component's, read out
         * of `design-seastem` rather than guessed:
         *
         *     width 450 · radius 10 · padding 24 · mask rgba(0,0,0,.40)
         *     title 24/1.334/700 in the type's colour
         *     description 16/1.5/500 · note 14/1.43/600
         *     buttons 14/1.43/600 · radius 6 · padding 8 12 · gap 12
         *     rhythm: title 24 below, description 20, note 12, footer 12
         *
         * Two deviations, both deliberate:
         *
         * SURFACE. The component is `#ffffff` with grey text because the
         * platform ships no dark mode. Here the roles are mapped onto this
         * page's own ground — panel, border-2, text, text2 — so the alert is
         * the same object in this room's light.
         *
         * FACE. It sets Inter, loaded from Google. This page is opened at a
         * bench on whatever the phone has, and a font request is a network
         * dependency for a screen that has to work when the network is the
         * thing being provisioned. Same scale, the page's own stack.
         */
        #confirm-dialog {
            width: 450px; max-width: calc(100vw - 32px);
            padding: 24px;
            /* `border: 0`, like the component. The surface is lighter than
               anything under it and the shadow does the separating, so an
               outline would only be a line drawn around a thing already
               standing off the page. */
            border: none; border-radius: 10px;
            background: var(--panel-top); color: var(--text);
            text-align: center;
            box-shadow: 0 4px 6px -2px rgba(0,0,0,0.30),
                        0 12px 16px -4px rgba(0,0,0,0.45);
        }
        #confirm-dialog::backdrop { background: rgba(0,0,0,0.40); }
        /* The component's zoom-in, at its own duration. */
        #confirm-dialog[open] { animation: dialog-in .07s ease-out; }
        @keyframes dialog-in {
            from { opacity: 0; transform: scale(0.96); }
            to   { opacity: 1; transform: scale(1); }
        }
        @media (prefers-reduced-motion: reduce) {
            #confirm-dialog[open] { animation: none; }
        }
        /* 40x40 from a 16 viewBox, in the warning colour the platform uses. */
        .dialog-icon {
            width: 40px; height: 40px; display: block; margin: 0 auto;
            fill: #f79009;
        }
        /* The title wears the type's colour — that is the component's rule,
           and it is what makes the icon and the question one gesture. */
        #confirm-title {
            margin: 0 0 24px;
            font-size: 24px; line-height: 1.334; font-weight: 700;
            color: #f79009;
        }
        #confirm-body p {
            margin: 0 0 20px;
            font-size: 16px; line-height: 1.5; font-weight: 500;
            color: var(--text2);
        }
        /* The `note` slot, and here it always holds the same thing: the name
           of the folder being let go of. Mono, because it is a name off a
           disk rather than a sentence, and every other name this page shows
           off a disk is mono too. */
        #confirm-body .subject {
            margin: 0 0 12px;
            font-family: ui-monospace, "SF Mono", Menlo, monospace;
            font-size: 14px; line-height: 1.43; font-weight: 600;
            color: var(--text);
            word-break: break-all;
        }
        #confirm-body p:last-child { margin-bottom: 0; }
        .dialog-actions {
            display: flex; justify-content: center; gap: 12px;
            margin-top: 12px;
        }
        .dialog-actions button {
            display: inline-flex; align-items: center; justify-content: center;
            padding: 8px 12px; border-radius: 6px; border: none;
            font-size: 14px; line-height: 1.43; font-weight: 600;
            font-family: inherit;
            transition: all .25s ease-out;
            -webkit-tap-highlight-color: transparent;
        }
        /* secondary-gray */
        .dialog-actions button[value="cancel"] {
            color: var(--text2); background: transparent;
            /* One step up from `--border-2`: the outline has to read on the
               lightest surface on the page, not on a card. */
            outline: 1px solid #45577a;
        }
        .dialog-actions button[value="cancel"]:hover {
            color: var(--text); background: #2a3e5e;
            outline-color: #5a6e93;
        }
        /* primary. FIREFLY[600] and [700] straight off the token file — the
           one colour on this page that is the platform's rather than this
           app's, and it is on the platform's own component. */
        #confirm-ok {
            color: #fdfdfd; background: #2b81a0; outline: 1px solid #2b81a0;
        }
        #confirm-ok:hover { background: #206078; outline-color: #86c6de; }
        .dialog-actions button:focus-visible {
            outline: 2px solid var(--accent); outline-offset: 2px;
        }

        .console-foot {
            flex: 0 0 auto;
            background: var(--chrome);
            border-top: 2px solid var(--border);
            box-shadow: 0 -6px 16px rgba(0,0,0,0.35);
            position: relative; z-index: 2;
        }

        .at-row {
            display: flex; gap: 6px;
            padding: 10px var(--rail-pad) 10px;
            align-items: stretch;
        }

        /*
         * A picker of our own rather than a `<select>`.
         *
         * A native select on the second-to-last row of a full-height page opens
         * wherever the platform decides — upward, overlapping, sized to the
         * viewport, and on 58 entries that is a full-screen native list with no
         * grouping the eye can use. Here the direction is a decision: the panel
         * is anchored to the TOP of the control and grows up, over the terminal,
         * because there is nothing below this row but the stage buttons.
         *
         * It is a listbox, not a menu: picking writes into the field and closes.
         * Nothing is sent, so nothing here needs confirming.
         */
        /*
         * The trigger sits in the rail, and the panel inherits its width.
         *
         * The panel was carrying its own width for a while, which meant two
         * numbers that had to be kept agreeing by hand. `left: 0; right: 0`
         * removes the question: the list is exactly as wide as the control it
         * hangs off, and moving `--rail` moves both.
         *
         * The empty space to the right of this cluster is the point rather
         * than a gap — the stage buttons below are what legitimately spans the
         * screen, and now they are the only thing that does.
         */
        .at-picker {
            position: relative;
            /* The rail, minus the padding this row is inset by, so the right
               edge lands on the raw pane's divider rather than past it. */
            flex: 0 0 calc(var(--rail) - var(--rail-pad));
            max-width: calc(100vw - 216px);   /* leave the field and SEND their room */
            min-width: 0; display: flex;
        }
        #at-menu {
            flex: 1 1 auto; min-width: 0; min-height: 40px;
            display: flex; align-items: center; justify-content: space-between;
            gap: 8px; padding: 0 10px;
            border: 1px solid #334155; border-radius: 8px;
            background: #0f172a; color: #cbd5e1;
            font-size: 13px; text-align: left;
            -webkit-tap-highlight-color: transparent;
        }
        #at-menu:active { background: #1e293b; }
        #at-menu .chev { color: var(--muted); font-size: 10px; flex-shrink: 0; }
        #at-menu[aria-expanded="true"] { border-color: #475569; background: #1e293b; }

        .at-panel {
            position: absolute; bottom: calc(100% + 6px); left: 0; right: 0;
            z-index: 20;
            display: flex; flex-direction: column;
            max-height: min(52vh, 420px);
            border: 1px solid #475569; border-radius: 10px;
            background: #0b1220;
            box-shadow: 0 -8px 28px rgba(0,0,0,0.55);
            overflow: hidden;
        }
        .at-panel[hidden] { display: none; }
        #at-filter {
            flex: 0 0 auto; min-height: 38px; padding: 0 12px;
            border: none; border-bottom: 1px solid #1e293b;
            background: #0f172a; color: #e2e8f0;
            font-family: ui-monospace, monospace; font-size: 13px;
        }
        #at-filter::placeholder { color: #475569; }
        #at-list { flex: 1 1 auto; overflow-y: auto; -webkit-overflow-scrolling: touch; }
        .at-group {
            padding: 7px 12px 3px;
            font-size: 9px; font-weight: 700; letter-spacing: 0.1em;
            text-transform: uppercase; color: var(--muted);
            background: #0b1220; position: sticky; top: 0;
        }
        .at-opt {
            display: flex; align-items: baseline; gap: 8px;
            width: 100%; padding: 7px 12px;
            border: none; background: none; text-align: left;
            color: #cbd5e1; font-size: 13px;
            -webkit-tap-highlight-color: transparent;
        }
        .at-opt:hover, .at-opt.is-on { background: #1e293b; }
        .at-opt .cmd {
            flex: 0 0 auto;
            font-family: ui-monospace, "SF Mono", Menlo, monospace;
            color: #7dd3fc;
        }
        .at-opt .why {
            flex: 1 1 auto; min-width: 0;
            font-size: 11px; color: var(--muted);
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        /* A factory reset undoes a provisioning session. It is in the list
           because the list is the whole table, and it is red because being in
           the list is not the same as being an ordinary choice. */
        .at-opt.is-danger .cmd { color: #f87171; }
        .at-empty { padding: 14px 12px; font-size: 12px; color: var(--muted); }

        /* The same width as the trigger, from the same number — the two are a
           pair (pick one, or type one) and a pair that reads as a pair. */
        .at-row input#at-input {
            flex: 0 0 calc(var(--rail) - var(--rail-pad));
            min-width: 0; min-height: 40px; padding: 0 10px;
            border: 1px solid #334155; border-radius: 8px;
            background: #0b1220; color: #e2e8f0;
            font-family: ui-monospace, monospace; font-size: 13px;
        }
        .at-row input::placeholder { color: #475569; }
        #at-send {
            flex: 0 0 68px; min-height: 40px;
            border: 1px solid #334155; border-radius: 8px;
            background: #0f172a; color: #cbd5e1; font-size: 13px;
        }
        #at-send:active { background: #1e293b; }

        /* No spare width to leave, so the cluster goes back to filling the row
           and the trigger gives up what the field cannot do without. */
        @media (max-width: 560px) {
            .at-picker { flex: 1 1 auto; }
            .at-row input#at-input { flex: 0 0 96px; }
        }
    </style>
</head>
<body>
    <header>
        <a class="icon-btn" href="index.html" aria-label="Back">←</a>
        <!--
          Two questions, one line: what is this screen, and which unit is it
          pointed at. They are separated by a rule rather than a dot, because
          they are not two halves of one sentence — the second one changes
          every time the bench moves on and the first one never does.

          The link dot belongs to the IMEI, not to the bar. A number with a
          live dot in front of it answers "which unit" and "is it listening"
          as one object, which is the pair of facts this bar exists for.
        -->
        <span class="bar-id">
            <span class="bar-title">AIS01 End node configuration</span>
            <span class="bar-rule" aria-hidden="true"></span>
            <span class="bar-unit">
                <span id="link-state" class="dot link-disconnected" title="BLE link"></span>
                <b id="imei">—</b>
            </span>
        </span>
        <!--
          One button, and only until it has been pressed once, ever.

          Adopting a unit this browser already has permission for needs no user
          gesture, so once a unit has been paired the app attaches by itself and
          keeps trying while it sleeps — which is what the daemon does, and the
          daemon has no connect button. Opening the chooser is the one thing the
          browser insists a person start, so that is the one thing left here,
          and it hides the moment there is something to adopt instead.
        -->
        <div class="bar-tools">
            <button id="copy-log" title="Hand the whole raw serial buffer to whoever has to diagnose it">
                SHARE LOG
            </button>
            <!-- Named for what it does, which took two tries. It was CHANGE
                 UNIT, then CHANGE UNIT FOLDER — both named for the MOMENT it
                 is used, the bench moving on to the next unit. But nothing
                 here changes a unit or reaches a folder: it lets go of the
                 one this screen is pointed at, and ⓪ is what points it
                 somewhere new. A control named for the errand instead of the
                 effect is one its own confirm dialog cannot agree with.

                 What is let go of is the REFERENCE to the folder and the
                 permission to open it, which is all that survives a reload —
                 never the certificate, the key or the password, which are
                 re-read from disk each session. -->
            <button id="btn-forget"
                    title="Let go of the folder this screen is pointed at, so &quot;Select provisioning folder&quot; asks for one again. The BLE link is not touched.">
                CLEAR FOLDER
            </button>
            <!-- It stays on screen once paired and goes green instead of
                 vanishing. A control that disappears on success leaves the bar
                 with nothing where the link used to be, so the state you most
                 want confirmed is the one state with no words on it. -->
            <span id="pair-row">
                <button id="btn-connect">
                    <!-- The Bluetooth rune, drawn rather than typed: it has no
                         dependable glyph across the platforms this runs on. -->
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-width="2.2" stroke-linecap="round"
                         stroke-linejoin="round" aria-hidden="true">
                        <path d="M8 7l8 10-4 4V3l4 4-8 10"/>
                    </svg>
                    <span id="pair-label">PAIR DEVICE VIA BLE</span>
                </button>
            </span>
        </div>
        <span id="app-version" class="version"></span>
    </header>

    <main>
        <section class="pane pane-annotated">
            <div class="pane-head">HISTORY</div>
            <!-- Who is speaking, spelled out once. A row's colour is its
                 status; its badge is its source, and the two are independent:
                 the device reporting success and the app concluding it are not
                 the same claim. -->
            <div class="pane-head legend">
                <span class="v voice-dev">DEV</span> device
                <span class="v voice-cmd">CMD</span> sent
                <span class="v voice-sys">SYS</span> verdict
                <span class="v voice-you">YOU</span> your move
            </div>
            <div id="terminal"></div>
        </section>
        <section class="pane pane-raw">
            <div class="pane-head">RAW SERIAL</div>
            <pre id="terminal-raw"></pre>
            <div class="log-foot">
                <span id="raw-live" class="live off"><span class="dot"></span>waiting</span>
                <span><span id="raw-count">0</span> lines</span>
            </div>
        </section>
        <!-- Controls sit on the log they act on. SHARE hands the whole raw
             buffer to whoever has to diagnose it, which on a bench is not the
             person holding the phone. -->
    </main>

    <!--
      The fallback picker. ⓪ prefers `showDirectoryPicker()`, which hands back a
      handle the app can keep and re-open — that is what lets the material be
      re-read from disk instead of stored in this browser. This input is what
      stands in where that API is absent, and it cannot do the same: a `File`
      list is a one-time read with nothing behind it to remember.

      It lives outside the row that hides: a `display:none` input still opens
      its picker from ⓪, but a hidden ancestor is a needless risk for the one
      control a session cannot start without.

      `webkitdirectory`, and it is the whole point of this input. The material
      is a FOLDER — the one the technician downloaded from Drive and saved on
      their machine — because the folder name is where the unit's identity
      lives. AWS names the PEMs after the certificate ID, so no file inside
      says which unit it belongs to; the directory does, and a file pick throws
      it away.

      This briefly asked for files instead, back when the folder had to come
      from a phone's own Drive and cloud providers only expose files. That flow
      is gone, and with it the prepared `AIS01-CB-<IMEI>.json` that existed to
      carry the IMEI past a picker that could not.

      No `accept` filter: the folder legitimately contains files we ignore
      (AmazonRootCA*.pem, *-public.pem.key), and filtering by extension would
      hide the ones that matter on some file managers. loadFiles() decides what
      matters, by the names the server generated.
    -->
    <input id="bundle-input" type="file" webkitdirectory directory multiple hidden>

    <!-- One command, sent as typed. The session has to be unlocked first: the
         app answers `AT` and `AT?` itself but ignores everything else until the
         password lands, so an unanswered command this early is a locked
         console, not a wrong command.

         Picking from the menu only FILLS the field — sending stays a separate
         press. The technician owns when a command goes out, which is the same
         principle the four stage buttons follow, and a menu that sent on
         selection would be a stray tap away from an ATZ mid-write. -->
    <!-- The controls, on their own ground. Above this line is what the device
         says; below it is what you can do to it. -->
    <!--
      The platform's `FeedbackAlert`, rebuilt.

      `packages/design-seastem/src/components/Feedback/FeedbackAlert/` in
      waterplan-frontend: centred, one icon over one question, a line of prose
      under it, two buttons side by side with Cancel on the left. This markup
      is that component's DOM order — icon, message, description, note,
      footer — so the two read as the same object even though one is React on
      antd and this is a `<dialog>` on a static page.

      The one thing not copied is its surface. That component is white on
      white because the platform has no dark mode; this page is a console a
      technician reads at a bench, and a full-bleed white card is the one
      thing on it that would be looked away from. Same geometry, same scale,
      this page's ground — see the CSS.
    -->
    <dialog id="confirm-dialog" aria-labelledby="confirm-title">
        <!-- Warning, which is the component's default type and the honest one
             here: this asks before letting go of something. -->
        <svg class="dialog-icon" viewBox="0 0 16 16" aria-hidden="true">
            <path d="M7.019.855a2 2 0 0 1 2.691.706l.002.003 5.647 9.427.005.009a2 2 0 0 1-1.71 3H2.347a2 2 0 0 1-1.71-3l.005-.01L6.29 1.56a2 2 0 0 1 .73-.704M8 1.931a.67.67 0 0 0-.569.32l-5.642 9.42a.667.667 0 0 0 .569.996h11.285a.667.667 0 0 0 .569-.996L8.57 2.252a.67.67 0 0 0-.57-.32m0 2.736c.368 0 .667.298.667.666V8a.667.667 0 1 1-1.333 0V5.333c0-.368.298-.666.666-.666m-.666 6c0-.368.298-.667.666-.667h.007a.667.667 0 0 1 0 1.333H8a.667.667 0 0 1-.666-.666"/>
        </svg>
        <h2 id="confirm-title"></h2>
        <div id="confirm-body"></div>
        <!-- `method="dialog"` closes and sets returnValue from the pressed
             button, so Cancel, Escape and the backdrop all land on the same
             "not ok" without a line of script between them. -->
        <form method="dialog" class="dialog-actions">
            <button value="cancel">Cancel</button>
            <button value="ok" id="confirm-ok"></button>
        </form>
    </dialog>

    <div class="console-foot">
    <div class="at-row">
        <div class="at-picker">
            <button id="at-menu" type="button" aria-haspopup="listbox"
                    aria-expanded="false" aria-controls="at-panel">
                <span>Pick an AT command</span><span class="chev">▲</span>
            </button>
            <!-- Opens upward on purpose: there is nothing below this row but
                 the stage buttons, and a list of 58 needs the terminal's
                 height rather than the six rows a native select would get. -->
            <div class="at-panel" id="at-panel" hidden>
                <input id="at-filter" type="text" spellcheck="false"
                       autocapitalize="off" autocorrect="off"
                       placeholder="filter — Enter takes the first">
                <div id="at-list" role="listbox" aria-label="AT commands"></div>
            </div>
        </div>
        <input id="at-input" type="text" spellcheck="false"
               autocapitalize="off" autocorrect="off"
               placeholder="or type">
        <button id="at-send">SEND</button>
    </div>

    <!--
      The bundle is step zero, not a separate row above the steps.
      Nothing below it can run without it — ① needs the password it carries and
      ② needs the PEMs — so it belongs in the same sequence, in the position
      that says "before anything else", wearing the same mark the others wear.
    -->
    <!--
      Each button says what it DOES, not what it is about.

      `CERTS` and `CONFIG` are what the thing is called once you already know
      the sequence; they are useless to anyone reading the screen to find out
      what it is. The numbers carry the order, so the words are free to carry
      the action — and the difference between "CONFIG" and "Apply network and
      MQTT settings" is the difference between a label and an instruction.
    -->
    <div class="actions">
        <button id="btn-bundle">
            <span class="status-circle" id="dot-bundle"></span>
            <span class="chip-txt">
                <span class="name">Select provisioning folder</span>
                <span id="mark-bundle" class="mark"></span>
            </span>
        </button>
        <!--
          Pairing is in this row AND in the bar above, which is a duplicate on
          purpose and the only one on this screen.

          They answer different questions. The bar answers "is the link up",
          which is asked continuously and from across a bench — so it keeps its
          words, its colour and its place beside the link dot. This chip answers
          "where am I in the sequence", which is asked once per unit by somebody
          walking the steps in order, and a sequence that silently omits the step
          between picking a folder and logging in is a step learned by memory
          instead of read off the screen.

          Its mark is the name the unit advertises, in the same figures ⓪ prints
          for the folder. Side by side they are the comparison this whole screen
          exists to make: which unit the material is for, and which unit is
          answering.
        -->
        <button id="btn-ble">
            <span class="status-circle" id="dot-ble"></span>
            <span class="chip-txt">
                <span class="name">Connect via Bluetooth</span>
                <span id="mark-ble" class="mark"></span>
            </span>
        </button>
        <button id="btn-login">
            <span class="status-circle" id="dot-login"></span>
            <span class="chip-txt">
                <span class="name">Log in to device console</span>
                <span id="mark-login" class="mark"></span>
            </span>
        </button>
        <button id="btn-certs">
            <span class="status-circle" id="dot-certs"></span>
            <span class="chip-txt">
                <span class="name">Write certificates into modem</span>
                <span id="mark-certs" class="mark"></span>
            </span>
        </button>
        <!--
          ③ and ④ were one button called "network and MQTT", and it only ever
          sent the MQTT half — `firmware-factory/scripts/` splits the job in
          two and this app had implemented one of them. They are separate
          because they are answerable to different things: ④ is derived from
          the folder's NAME (the IMEI makes the topics, the environment makes
          the broker), while ③ is derived from the SIM the unit will sit
          beside — which no name knows, and which `region.txt` carries.
        -->
        <button id="btn-network">
            <span class="status-circle" id="dot-network"></span>
            <span class="chip-txt">
                <span class="name">Apply cellular network settings</span>
                <span id="mark-network" class="mark"></span>
            </span>
        </button>
        <button id="btn-config">
            <span class="status-circle" id="dot-config"></span>
            <span class="chip-txt">
                <span class="name">Apply MQTT broker settings</span>
                <span id="mark-config" class="mark"></span>
            </span>
        </button>
        <button id="btn-verify">
            <span class="status-circle" id="dot-verify"></span>
            <span class="chip-txt">
                <span class="name">Verify publish to AWS IoT</span>
                <span id="mark-verify" class="mark"></span>
            </span>
        </button>
    </div>
    </div>

    <script type="module">
        import { initProvision } from './modules/provision.js';
        initProvision();
    </script>
</body>
</html>
